<html>
<head>
    <title>Event Registration</title>
    <script>
        function data() {
            var name = document.getElementById("fn").value.trim();
            var email = document.getElementById("em").value.trim();
            var phone = document.getElementById("ps").value.trim();

            if (name === "") {
                alert("Please fill in your full name.");
                return;
            }
            if (email === "") {
                alert("Please enter your email.");
                return;
            }
            if (phone === "") {
                alert("Please enter your phone number.");
                return;
            }

            alert("Registration Successful!");
        }
    </script>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 20px;
        }
        form {
            background: white;
            padding: 20px;
            width: 300px;
            border-radius: 10px;
        }
        input, button {
            width: 100%;
            margin: 5px;
            padding: 8px;
        }
    </style>
</head>

<body>
    <h2>Event Registration Form</h2>

    <form onsubmit="event.preventDefault(); data();">
        <input id="fn" type="text" placeholder="Full Name">
        <input id="em" type="email" placeholder="Email">
        <input id="ps" type="text" placeholder="Phone Number">
        <button type="submit">Register</button>
    </form>

</body>
</html>
